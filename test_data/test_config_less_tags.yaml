
filters:
  status: ["active", "staged", "offline"]
whitelist:
blacklist:
nsg_blacklist:

default_channels:
  "*":
    - v2ro

domain: test.com

nsgTags:
  Site:
    path: site.name
  Monitor:
    path: status.value
    transform: upper
    mapping:
      active: alerted
      "*": ignored
  Lat:
    path: latitude
  Lon:
    path: longitude
